# ARAK Content Studio — n8n, self-hosted in its own container.
#
# Deliberately separate from any other n8n container on this machine
# (e.g. the Lighting project's `lighting-n8n-1`, which binds host port
# 5678) — different container name, different port, different volume, so
# starting/stopping/rebuilding this one never touches that one.
#
# Workflow JSON lives in ../workflows/ (version-controlled, generated by
# ../gen_workflows.py) and gets imported into this container — see
# ../docker/README.md for the import command. The container itself only
# holds runtime state (credentials, execution history, the imported
# workflow definitions) in the named volume below.
#
# Secrets (ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_KEY, FAL_KEY,
# REPLICATE_API_TOKEN) come from .env, which is gitignored — copy
# .env.example to .env and fill in real values before starting.
#
# Built from ./Dockerfile rather than pulled, because the Creative Compose
# workflow needs ffmpeg in the container (see the Dockerfile for why it's a
# multi-stage copy and not `apk add`). Rebuild after changing it with:
#     docker compose up -d --build
# The named volume below is untouched by a rebuild, so imported workflows,
# credentials and execution history all survive.

services:
  n8n:
    build: .
    image: arak-marketing-n8n:ffmpeg
    container_name: arak-marketing-n8n
    restart: unless-stopped
    ports:
      - "5680:5678"
    # Resolve names through public resolvers rather than Docker Desktop's
    # embedded forwarder at 127.0.0.11.
    #
    # Observed 2026-08-17: a generate round lost one of its two candidates to
    # "getaddrinfo ENOTFOUND fal.run" while the other candidate resolved the
    # same domain in the same second. The embedded resolver forwards to
    # whatever the host's resolver list was when the VM last read it, and it
    # drops a lookup after a network change (a VPN, a wifi hop) until that
    # list is re-read. Naming resolvers here takes that stale hop out of the
    # path. The workflows also retry a failed lookup now — belt and braces,
    # since only one of the two is inside this repo's control on any given
    # machine.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # n8n 2.0 disabled ExecuteCommand and LocalFileTrigger by default as a
      # documented breaking change; the default value of NODES_EXCLUDE is
      # ["n8n-nodes-base.executeCommand", "n8n-nodes-base.localFileTrigger"].
      # Creative Compose needs ExecuteCommand to run ffmpeg, so this re-enables
      # that one and leaves the trigger off. Without it the workflow imports
      # and publishes fine but never activates — the log says "Unrecognized
      # node type" and the webhook 404s, which looks nothing like a config
      # problem from the outside.
      #
      # The security trade-off, stated plainly: any workflow here can now run
      # shell inside the container. Accepted 2026-08-11 because this instance
      # is localhost-only and anyone who can edit a workflow could already read
      # $env and exfiltrate the service_role key through an HTTP node, so it
      # widens very little. Creative Compose additionally allowlists every URL
      # (must be our own storage, no shell metacharacters) before it builds a
      # command.
      - NODES_EXCLUDE=["n8n-nodes-base.localFileTrigger"]
      # n8n's task runner kills a Code node's execution at 300s by default —
      # unrelated to, and shorter than, the poll loop the video Code nodes
      # (Render Video, Edit Video) intentionally run: up to 150 tries × 3s =
      # 450s, waiting on fal. Found 2026-08-11 when a Seedance render that fal
      # was still genuinely working on got silently killed at the 300s mark:
      # execution status "error", NONE of our own nodes ran (not even Mark
      # Failed), so the row was left 'pending' forever with no error and no
      # trace of the request_id needed to ever recover it — worse than a
      # normal failure, because our own error-handling design never got to
      # run. 600s gives the full 450s poll budget real headroom; if a poll
      # budget is ever raised above ~500s, raise this too.
      - N8N_RUNNERS_TASK_TIMEOUT=600
      - GENERIC_TIMEZONE=Asia/Riyadh
      - TZ=Asia/Riyadh
      # The research agent, over the Docker network (the `agent` service
      # below). Set here rather than in .env so it cannot be left pointing at
      # Vercel: the "Agent — weekly research run" workflow calls
      # $env.AGENT_BASE_URL/api/agent/{run,lens,synthesise}.
      - AGENT_BASE_URL=http://agent:3000
    volumes:
      - arak_marketing_n8n_data:/home/node/.n8n
      - ../workflows:/workflows:ro

  # ── The research agent ────────────────────────────────────────────────────
  # The same api/agent handlers Vercel runs, as a long-lived Node process (see
  # server/agent.js). n8n drives a run through it: the Monday schedule and the
  # app's Run button both land in the "Agent — weekly research run" workflow.
  #
  # Why here and not Vercel: on Vercel every step of a run lives inside a 300s
  # ceiling, and a run that drove itself there was refused with 508
  # INFINITE_LOOP_DETECTED. On this machine neither limit exists, so the time
  # budgets below are set well past Vercel's.
  #
  # Holds no state. Everything it reads and writes is in Supabase, so moving it
  # to another machine is this file, the repo and .env.
  agent:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: arak-marketing-agent:latest
    container_name: arak-marketing-agent
    restart: unless-stopped
    # Loopback only: n8n reaches it by service name, and nothing outside this
    # machine should reach it at all. The port is for `curl localhost:5690/healthz`.
    ports:
      - "127.0.0.1:5690:3000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    environment:
      - AGENT_PORT=3000
      # The agent reads SUPABASE_SERVICE_ROLE_KEY; this .env has always called
      # the same key SUPABASE_KEY. Either name works.
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_KEY}}
      # Time budgets (src/lib/agent/phases.js). Vercel keeps its defaults
      # (300s ceiling, 225s lens); here a slow tender search gets 7 minutes.
      # n8n's lens and synthesise HTTP timeouts are 10 minutes, above these.
      - AGENT_CEILING_MS=900000
      - AGENT_LENS_BUDGET_MS=420000
      - AGENT_SYNTHESISE_BUDGET_MS=360000

volumes:
  arak_marketing_n8n_data:
    name: arak_marketing_n8n_data
