# ARAK Content Studio — n8n, self-hosted in its own container.
#
# Deliberately separate from any other n8n container on this machine
# (e.g. the Lighting project's `lighting-n8n-1`, which binds host port
# 5678) — different container name, different port, different volume, so
# starting/stopping/rebuilding this one never touches that one.
#
# Workflow JSON lives in ../workflows/ (version-controlled, generated by
# ../gen_workflows.py) and gets imported into this container — see
# ../docker/README.md for the import command. The container itself only
# holds runtime state (credentials, execution history, the imported
# workflow definitions) in the named volume below.
#
# Secrets (ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_KEY, FAL_KEY,
# REPLICATE_API_TOKEN) come from .env, which is gitignored — copy
# .env.example to .env and fill in real values before starting.
#
# Built from ./Dockerfile rather than pulled, because the Creative Compose
# workflow needs ffmpeg in the container (see the Dockerfile for why it's a
# multi-stage copy and not `apk add`). Rebuild after changing it with:
#     docker compose up -d --build
# The named volume below is untouched by a rebuild, so imported workflows,
# credentials and execution history all survive.

services:
  n8n:
    build: .
    image: arak-marketing-n8n:ffmpeg
    container_name: arak-marketing-n8n
    restart: unless-stopped
    ports:
      - "5680:5678"
    env_file:
      - .env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # n8n 2.0 disabled ExecuteCommand and LocalFileTrigger by default as a
      # documented breaking change; the default value of NODES_EXCLUDE is
      # ["n8n-nodes-base.executeCommand", "n8n-nodes-base.localFileTrigger"].
      # Creative Compose needs ExecuteCommand to run ffmpeg, so this re-enables
      # that one and leaves the trigger off. Without it the workflow imports
      # and publishes fine but never activates — the log says "Unrecognized
      # node type" and the webhook 404s, which looks nothing like a config
      # problem from the outside.
      #
      # The security trade-off, stated plainly: any workflow here can now run
      # shell inside the container. Accepted 2026-08-11 because this instance
      # is localhost-only and anyone who can edit a workflow could already read
      # $env and exfiltrate the service_role key through an HTTP node, so it
      # widens very little. Creative Compose additionally allowlists every URL
      # (must be our own storage, no shell metacharacters) before it builds a
      # command.
      - NODES_EXCLUDE=["n8n-nodes-base.localFileTrigger"]
      - GENERIC_TIMEZONE=Asia/Riyadh
      - TZ=Asia/Riyadh
    volumes:
      - arak_marketing_n8n_data:/home/node/.n8n
      - ../workflows:/workflows:ro

volumes:
  arak_marketing_n8n_data:
    name: arak_marketing_n8n_data
